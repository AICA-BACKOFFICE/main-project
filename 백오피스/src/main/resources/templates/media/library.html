<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('미디어 관리', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">미디어 관리 <span class="sub">게시물과 같은 카테고리로 이미지 · 동영상 · 문서를 분류해 두면 글쓰기 '보관함'에서 바로 꺼내 쓸 수 있습니다.</span></h2>

  <div class="card media-card">
    <!-- 카테고리 탭 (게시물 관리와 동일한 1단) -->
    <div class="media-tabs">
      <a th:href="@{/admin/media(cat='all', kind=${kind})}" th:classappend="${cat == 'all'} ? 'on'">전체 <b th:text="${totalAll}">0</b></a>
      <a th:each="c : ${tree}" th:href="@{/admin/media(cat=${c.id}, kind=${kind})}" th:classappend="${cat == #strings.toString(c.id)} ? 'on'">
        <span th:text="${c.name}">카테고리</span> <b th:text="${c.postCount}">0</b>
      </a>
      <a th:href="@{/admin/media(cat='unfiled', kind=${kind})}" th:classappend="${cat == 'unfiled'} ? 'on'" class="dim">미분류 <b th:text="${totalUnfiled}">0</b></a>
      <span class="media-tabs-note">분류는 게시물 관리의 카테고리와 같습니다</span>
    </div>

    <!-- 세부 카테고리 탭 (후기 → 생활·수업… / 기수별 → 3~5기·6기·7기) -->
    <div class="media-subtabs" th:if="${current != null and !#lists.isEmpty(current.children)}">
      <a th:href="@{/admin/media(cat=${current.id}, kind=${kind})}" th:classappend="${sub == null} ? 'on'">전체 <b th:text="${current.postCount}">0</b></a>
      <a th:each="s : ${current.children}" th:href="@{/admin/media(cat=${current.id}, sub=${s.id}, kind=${kind})}" th:classappend="${sub == s.id} ? 'on'">
        <span th:text="${s.name}">세부</span> <b th:text="${s.postCount}">0</b>
      </a>
    </div>

    <!-- 종류 탭 · 총 용량 -->
    <div class="media-kinds">
      <a th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind='ALL')}" th:classappend="${kind == 'ALL'} ? 'on'">전체</a>
      <a th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind='IMAGE')}" th:classappend="${kind == 'IMAGE'} ? 'on'">이미지 <b th:text="${countImage}">0</b></a>
      <a th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind='VIDEO')}" th:classappend="${kind == 'VIDEO'} ? 'on'">동영상 <b th:text="${countVideo}">0</b></a>
      <a th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind='DOC')}" th:classappend="${kind == 'DOC'} ? 'on'">문서 <b th:text="${countDoc}">0</b></a>
      <span class="media-total">총 용량 <b th:text="${#numbers.formatDecimal(totalBytes / 1048576.0, 1, 1)} + ' MB'">0 MB</b> · 한도: 이미지 10MB · 문서 20MB · 동영상 200MB</span>
    </div>

    <!-- 검색 · 업로드 -->
    <div class="card-head">
      <div class="left">
        <form th:action="@{/admin/media}" method="get" class="media-search">
          <input type="hidden" name="cat" th:value="${cat}">
          <input type="hidden" name="sub" th:value="${sub}">
          <input type="hidden" name="kind" th:value="${kind}">
          <input class="input" type="search" name="keyword" th:value="${keyword}" placeholder="파일명 검색" style="width:200px">
          <button class="btn ghost sm" type="submit">검색</button>
          <a class="btn ghost sm" th:if="${keyword != null and !keyword.isBlank()}" th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind=${kind})}">초기화</a>
        </form>
        <span class="count">(표시 <span th:text="${#lists.size(result.items)}">0</span>건 / 총 <span th:text="${result.total}">0</span> 건)</span>
      </div>
      <div class="media-upload">
        <select class="select" id="uploadCategory" title="업로드할 카테고리">
          <option value="" th:selected="${current == null}">미분류로 올리기</option>
          <option th:each="c : ${tree}" th:value="${c.id}" th:text="${c.name}" th:selected="${current != null and current.id == c.id}"></option>
        </select>
        <select class="select" id="uploadSubCategory" title="세부 카테고리">
          <option value="">세부 카테고리</option>
          <th:block th:each="c : ${tree}">
            <option th:each="s : ${c.children}" th:value="${s.id}" th:text="${s.name}" th:attr="data-parent=${c.id}" th:selected="${sub == s.id}"></option>
          </th:block>
        </select>
        <input type="file" id="uploadInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,application/pdf,.mp4,.webm,.pdf" multiple hidden>
        <button class="btn primary" type="button" id="uploadBtn">파일 업로드</button>
      </div>
    </div>

    <div class="media-drop" id="dropZone">
      <div class="media-progress" id="uploadProgress" hidden></div>

      <div class="empty-state" th:if="${result.empty}">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
        <div th:text="${keyword != null and !keyword.isBlank()} ? '검색 결과가 없습니다.' : '이 분류에 파일이 없습니다. 위의 업로드 버튼을 누르거나 이 영역에 파일을 끌어다 놓으세요. (이미지 · MP4/WEBM 동영상 · PDF)'">파일이 없습니다.</div>
      </div>

      <div class="media-grid" th:unless="${result.empty}">
        <div class="media-item" th:each="img : ${result.items}" th:classappend="'k-' + ${#strings.toLowerCase(img.kind)}">
          <a class="media-thumb" th:href="${img.url}" target="_blank" rel="noopener" th:title="${img.originalName}">
            <img th:if="${img.image}" th:src="${img.url}" th:alt="${img.label}" loading="lazy">
            <video th:if="${img.video}" th:src="${img.url}" preload="metadata" muted playsinline></video>
            <span class="media-doc" th:if="${!img.image and !img.video}">
              <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
              <b>PDF</b>
            </span>
            <span class="media-kind" th:if="${!img.image}" th:text="${img.video} ? '동영상' : '문서'">동영상</span>
          </a>
          <div class="media-meta">
            <form class="media-rename-form" th:action="@{/admin/media/{id}/rename(id=${img.id})}" method="post">
              <input type="hidden" name="back" th:value="${cat}">
              <input type="hidden" name="backSub" th:value="${sub}">
              <input type="hidden" name="kind" th:value="${kind}">
              <input class="name-input" type="text" name="displayName" th:value="${img.label}" maxlength="255" th:title="'원본: ' + ${img.originalName} + ' · 클릭해 이름 수정, Enter 로 저장'" th:readonly="${me == null or !me.role.canManageContent()}">
              <!--/* 이름을 바꿀 수 있다는 걸 알 수 있게 연필 아이콘: 누르면 이름 칸에서 바로 고치기(Enter 저장 · Esc 취소) */-->
              <button type="button" class="name-edit" th:if="${me != null and me.role.canManageContent()}" title="이름 바꾸기" aria-label="이름 바꾸기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
              </button>
              <button type="submit" class="btn ghost xs save" title="이름 저장">저장</button>
            </form>
            <div class="sub">
              <span th:text="${img.sizeBytes >= 1048576} ? ${#numbers.formatDecimal(img.sizeBytes / 1048576.0, 1, 1)} + 'MB' : ${#numbers.formatDecimal(img.sizeBytes / 1024.0, 0, 0)} + 'KB'">0KB</span>
              · <span th:text="${#temporals.format(img.createdAt, 'yyyy-MM-dd')}">날짜</span>
              <span th:if="${img.uploaderName != null}" th:text="'· ' + ${img.uploaderName}">· 등록자</span>
            </div>
            <div class="sub" th:if="${cat == 'all' or sub == null}">
              <span class="tag" th:if="${img.categoryPath != null}" th:text="${img.categoryPath}">후기 › 생활</span>
              <span class="tag dim" th:if="${img.categoryPath == null}">미분류</span>
            </div>
          </div>
          <div class="media-actions">
            <button class="btn ghost xs copy-url" type="button" th:data-url="${img.url}" title="파일 주소 복사">주소 복사</button>
            <form class="media-move-form" th:action="@{/admin/media/{id}/move(id=${img.id})}" method="post" th:if="${me != null and me.role.canManageContent()}">
              <input type="hidden" name="back" th:value="${cat}">
              <input type="hidden" name="backSub" th:value="${sub}">
              <input type="hidden" name="kind" th:value="${kind}">
              <select class="select xs move-cat" name="categoryId" title="카테고리 이동">
                <option value="" th:selected="${img.categoryId == null}">미분류</option>
                <option th:each="c : ${tree}" th:value="${c.id}" th:text="${c.name}" th:selected="${img.categoryId == c.id}"></option>
              </select>
              <select class="select xs move-sub" name="subCategoryId" title="세부 카테고리">
                <option value="">세부</option>
                <th:block th:each="c : ${tree}">
                  <option th:each="s : ${c.children}" th:value="${s.id}" th:text="${s.name}" th:attr="data-parent=${c.id}" th:selected="${img.subCategoryId == s.id}"></option>
                </th:block>
              </select>
            </form>
            <form th:action="@{/admin/media/{id}/delete(id=${img.id})}" method="post" th:if="${me != null and me.role.canManageContent()}"
                  data-confirm="이 파일을 완전히 삭제할까요? 이미 글 본문에 넣은 파일이라면 그 글에서 깨집니다.">
              <input type="hidden" name="back" th:value="${cat}">
              <input type="hidden" name="backSub" th:value="${sub}">
              <input type="hidden" name="kind" th:value="${kind}">
              <button class="btn danger xs" type="submit">삭제</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <nav class="pager" th:if="${result.totalPages > 1}">
      <a th:if="${result.hasPrev}" th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind=${kind}, keyword=${keyword}, page=${result.page - 1})}">‹</a>
      <span class="dis" th:unless="${result.hasPrev}">‹</span>
      <th:block th:each="n : ${result.pageNumbers}">
        <span class="cur" th:if="${n == result.page}" th:text="${n}">1</span>
        <a th:unless="${n == result.page}" th:text="${n}" th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind=${kind}, keyword=${keyword}, page=${n})}">2</a>
      </th:block>
      <a th:if="${result.hasNext}" th:href="@{/admin/media(cat=${cat}, sub=${sub}, kind=${kind}, keyword=${keyword}, page=${result.page + 1})}">›</a>
      <span class="dis" th:unless="${result.hasNext}">›</span>
    </nav>
  </div>

  <div id="mediaConfig" hidden th:data-upload-url="@{/admin/images}" th:data-cat="${cat}" th:data-sub="${sub}" th:data-kind="${kind}"></div>
</main>
<th:block th:fragment="scripts">
  <!-- core.js 는 단독으로 동작하는 공용 모듈(이미지 용량 줄이기 + 업로드 fetch). 동영상·문서는 그대로 올린다 -->
  <script th:src="@{/js/editor/core.js}"></script>
  <script th:src="@{/js/category-select.js}"></script>
  <script th:src="@{/js/media/library.js}"></script>
</th:block>
</body>
</html>
