<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('지원 전 Check FAQ 관리', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">지원 전 Check FAQ 관리</h2>
  <!--/* 화면은 static/js/page/faq.js 가 그림. 저장하면 DB에 들어가고 사이트가 공개 API로 받아 그림(CheckFaqService) */-->
  <div id="faqAdmin" class="fq"
       th:data-api="@{/admin/pages/faq/api}"
       th:data-front="${frontLink}"
       th:data-editor="@{/admin/pages/check/edit}"
       th:data-draft-api="@{/admin/pages/api/draft(page='check')}">
    <div class="card fq-loading">질문을 불러오는 중이에요…</div>
  </div>
</main>
<th:block th:fragment="scripts">
  <script th:src="@{/js/page/faq.js(v='20261019')}"></script>
</th:block>
</body>
</html>
