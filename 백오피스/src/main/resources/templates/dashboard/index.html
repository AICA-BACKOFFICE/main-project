<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('관리자 홈', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">관리자 홈</h2>

  <!--/* 선배들의 이야기 글: 후기 · 인터뷰 · 프로젝트 표마다 글 수(휴지통 제외) */-->
  <div class="dash-kinds">
    <section class="dash-kind" th:each="k : ${kinds}">
      <div class="dash-kind-head">
        <h3 th:text="'선배 ' + ${k.label}">선배 후기</h3>
        <a th:href="@{/admin/posts(kind=${k.slug})}">목록 보기 ›</a>
      </div>
      <div class="dash-kind-total"><span th:text="${k.total}">0</span><small>개</small></div>
      <div class="dash-status">
        <span>게시중<b th:text="${k.published}">0</b></span>
        <span>임시저장<b th:text="${k.draft}">0</b></span>
        <span>미게시<b th:text="${k.hidden}">0</b></span>
      </div>
      <div class="dash-groups">
        <th:block th:each="g : ${k.groups}">
          <a th:if="${g['subCategoryId'] != null}" th:href="@{/admin/posts(categoryId=1, subCategoryId=${g['subCategoryId']})}">
            <span th:text="${g.name}">생활</span><em th:text="${g.count}">0</em></a>
          <a th:unless="${g['subCategoryId'] != null}" th:href="@{/admin/posts(kind=${k.slug})}">
            <span th:text="${g.name}">6기</span><em th:text="${g.count}">0</em></a>
        </th:block>
        <span class="muted" th:if="${#lists.isEmpty(k.groups)}">아직 글이 없어요.</span>
      </div>
      <a class="btn ghost sm" th:href="@{/admin/posts/new(kind=${k.slug})}" th:text="${k.label} + ' 쓰기'">후기 쓰기</a>
    </section>
  </div>

  <h3 class="section-title">최근 글</h3>
  <div class="two-col">
    <div class="mini-card">
      <h4>최근에 쓴 글 8개</h4>
      <div class="muted" th:if="${#lists.isEmpty(recentPosts)}" style="font-size:12px;padding:8px 0">게시물이 없습니다.</div>
      <ol class="rank" th:unless="${#lists.isEmpty(recentPosts)}">
        <li th:each="p : ${recentPosts}">
          <span class="k" th:text="${p.categoryPath}">후기 › 생활</span>
          <a th:href="@{/admin/posts/{kind}/{id}/preview(kind=${p.kind}, id=${p.id})}" target="_blank" rel="noopener" data-preview th:data-title="${p.title}"
             th:data-edit="${me.role.canManageContent() or p.authorId == me.id} ? @{/admin/posts/{kind}/{id}/edit(kind=${p.kind}, id=${p.id})} : null" th:text="${p.title}">제목</a>
          <span class="c" th:text="${p.status.label}">게시중</span>
        </li>
      </ol>
    </div>
    <div class="mini-card">
      <h4>DB 표</h4>
      <ul class="dash-tables">
        <li><code>reviews</code> 후기 — 분야(생활 · 수업 · 프로젝트 · 취업 성공 · 진로 고민)로 나눠요</li>
        <li><code>interviews</code> 인터뷰 — 기수로 나눠요</li>
        <li><code>projects</code> 프로젝트 — 기수 · 반으로 나눠요</li>
        <li><code>admin_users</code> 관리자 계정</li>
      </ul>
      <p class="muted" style="font-size:12px;margin:12px 0 0">
        휴지통에 <a th:href="@{/admin/posts/trash}" th:if="${me.role.canManageContent()}"><b th:text="${trashCount}">0</b>개</a><b th:unless="${me.role.canManageContent()}" th:text="${trashCount} + '개'">0개</b> ·
        <span th:text="${#temporals.format(generatedAt, 'yyyy-MM-dd HH:mm')} + ' 기준'">기준</span>
      </p>
    </div>
  </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
