<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('인사교 라이프 게시물 관리', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">인사교 라이프 게시물 관리</h2>
  <!--/* 화면은 static/js/page/life-photos.js 가 그림. 사진 올리기는 카테고리 페이지 관리의 그림 올리기 API(인사교 라이프 assets/uploads)를 같이 씀 */-->
  <div id="lifePhotos" class="lp"
       th:data-api="@{/admin/pages/life-photos/api}"
       th:data-upload="@{/admin/pages/api/upload(page='life')}"
       th:data-site-base="@{/admin/pages/site/life/}"
       th:data-front="${frontLink}"
       th:data-editor="@{/admin/pages/life/edit}"
       th:data-section="${lifeSection}"
       th:data-draft-api="@{/admin/pages/api/draft(page='life')}">
    <div class="card lp-loading">사진을 불러오는 중이에요…</div>
  </div>
</main>
<th:block th:fragment="scripts">
  <script th:src="@{/js/page/life-photos.js(v='20261014c')}"></script>
</th:block>
</body>
</html>
