<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="(${form.id == null} ? '글쓰기' : '글 수정') + ' | ' + ${siteName}">글쓰기</title>
  <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
  <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;family=Nanum+Myeongjo:wght@400;700&amp;family=Gowun+Dodum&amp;family=Gowun+Batang:wght@400;700&amp;family=Nanum+Pen+Script&amp;family=Do+Hyeon&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/editor.css}">
  <link rel="stylesheet" th:href="@{/css/blocks.css}">
  <link rel="stylesheet" th:href="@{/css/story-form.css}">
</head>
<body class="ed-body">
<!-- 등록 · 수정 뒤 알림(서버가 다시 열어 준 글 수정 화면 위에 잠깐) -->
<div class="toast ed-done" role="status" th:if="${toast}" th:text="${toast}"></div>

<form id="postForm" th:object="${form}" method="post"
      th:action="${form.id == null} ? @{/admin/posts} : @{/admin/posts/{id}(id=${form.id})}">
  <input type="hidden" th:field="*{id}">
  <input type="hidden" th:field="*{blocksJson}" id="blocksJson">
  <input type="hidden" th:field="*{status}" id="statusField">
  <input type="hidden" th:field="*{thumbnailUrl}" id="thumbnailUrl">
  <input type="hidden" th:field="*{layoutJson}" id="layoutJson">
  <input type="hidden" th:field="*{storyJson}" id="storyJson">

  <!-- ===== 상단 바: 돌아가기 · 도구 · 저장 ===== -->
  <header class="ed-bar">
    <div class="ed-bar-left">
      <a class="ed-back" th:href="@{/admin/posts}" title="선배들의 이야기 게시물 관리로">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 선배들의 이야기 게시물 관리
      </a>
      <span class="ed-bar-title" th:text="${form.id == null} ? '새 글 작성' : '글 수정'">새 글 작성</span>
    </div>
    <div class="ed-bar-right">
      <span class="ed-stats" id="edStats" title="공백 포함 글자 수 · 블록 수"></span>
      <span class="ed-autosave" id="autosaveMsg"></span>
      <button class="ed-tool" type="button" id="btnHistory" th:if="${form.id != null}" title="저장·발행할 때마다 남는 이전 버전을 보고 되돌립니다">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg> 버전 이력
      </button>
      <button class="ed-tool" type="submit" th:formaction="@{/admin/posts/preview}" formtarget="_blank" formnovalidate data-preview-submit title="쓰고 있는 내용이 사이트에서 어떻게 보이는지 창으로 보기">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg> 미리보기
      </button>
      <span class="ed-bar-sep"></span>
      <button class="ed-btn" type="button" id="btnDraft" title="임시저장 상태로 서버에 저장 (Ctrl+S)">임시저장</button>
      <button class="ed-btn primary" type="button" id="btnSave">저장</button>
    </div>
  </header>

  <!-- ===== 상태 배너 ===== -->
  <div class="ed-banner" id="statusBanner" data-status="DRAFT">
    <b id="bannerLabel">임시저장</b>
    <span id="bannerText">아직 게시되지 않은 콘텐츠입니다. 저장만으로 공개되지 않습니다.</span>
  </div>

  <div class="ed-grid">
    <!-- ===== 본문 ===== -->
    <main class="ed-col">
      <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
        <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
      </div>
      <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      <div class="field-error" th:if="${#fields.hasErrors('blocksJson')}" th:errors="*{blocksJson}"></div>

      <label class="ed-field-label" for="title">제목</label>
      <input class="ed-title" th:field="*{title}" placeholder="제목을 입력하세요" maxlength="200" autocomplete="off">

      <!-- 선배들의 이야기(후기·인터뷰·프로젝트·기수별 모아보기) 고정 양식: 카테고리를 고르면 블록 편집기 대신 보임(post/story-form.js) -->
      <div id="storyForm" class="sf" hidden></div>

      <label class="ed-field-label ed-generic">본문</label>
      <div class="ed-box ed-generic">
        <div id="toolbar" class="ed-rt"></div>
        <div id="toolbar2" class="ed-rt ed-rt-more" hidden></div>
        <div id="tools" class="ed-rt-tools"></div>
        <div id="editor"></div>
      </div>
      <div class="ed-foot">
        <span class="ed-generic">본문은 블록 단위로 저장되며 프론트에서 같은 구성으로 표시됩니다. 사진은 붙여넣기·드래그로도 넣을 수 있습니다.</span>
        <span class="sf-only">발행하면 '선배들의 이야기' 사이트에 바로 올라가요. 미게시 · 휴지통으로 바꾸면 사이트에서도 내려가요.</span>
        <span class="ed-saved" th:if="${post != null and post.updatedAt != null}" th:text="'마지막 서버 저장 ' + ${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">마지막 서버 저장</span>
      </div>
    </main>

    <aside class="ed-props" th:replace="~{post/editor/_props :: props}"></aside>
  </div>

</form>

<form id="deleteForm" th:if="${form.id != null and me.role.canManageContent()}" th:action="@{/admin/posts/{id}/delete(id=${form.id})}" method="post"
      data-confirm="이 게시물을 휴지통으로 이동할까요? 목록과 프론트에서 제외되며 휴지통에서 복원할 수 있습니다."></form>
<form id="restoreForm" th:if="${form.id != null}" method="post" hidden></form>

<!-- 페이지 JS 설정값 (인라인 스크립트 대신 data-* 로 전달) -->
<div id="editorConfig" hidden
     th:data-upload-url="@{/admin/images}"
     th:data-recent-url="@{/admin/images/recent}"
     th:data-categories-url="@{/admin/images/categories}"
     th:data-templates-url="@{/admin/templates/api}"
     th:data-templates-page="@{/admin/templates}"
     th:data-versions-url="${form.id != null} ? @{/admin/posts/{id}/versions(id=${form.id})} : ''"
     th:data-post-id="${form.id}" th:data-can-manage-status="${me.role.canManageContent()}"></div>

<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/preview-modal.js}"></script>
<script th:src="@{/js/category-select.js}"></script>
<!-- 블록 에디터 라이브러리: 로드 순서 고정 (core → blocks → render → input → dialogs → toolbar → image-editor → index) -->
<script th:src="@{/js/editor/core.js}"></script>
<script th:src="@{/js/editor/blocks.js}"></script>
<script th:src="@{/js/editor/render.js}"></script>
<script th:src="@{/js/editor/input.js}"></script>
<script th:src="@{/js/editor/dialogs.js}"></script>
<script th:src="@{/js/editor/toolbar.js}"></script>
<script th:src="@{/js/editor/image-editor.js}"></script>
<script th:src="@{/js/editor/index.js}"></script>
<!-- 글쓰기 페이지 로직 -->
<script th:src="@{/js/post/editor-page.js}"></script>
<script th:src="@{/js/post/history.js}"></script>
<!-- 사진 편집 · 썸네일 맞추기 창(카테고리 페이지 관리 편집기와 같은 파일) -->
<script th:src="@{/js/page/photo-editor.js}"></script>
<script th:src="@{/js/post/story-form.js(v='20261019d')}"></script>
<script>PostEditorPage.init(document.getElementById('editorConfig').dataset);</script>
</body>
</html>
