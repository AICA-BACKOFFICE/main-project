<!-- 글쓰기 화면 — 우측 템플릿 패널: 불러오기 전용 (post/editor.html 에서 th:replace 로 포함, static/js/post/templates.js 가 제어). 생성·수정·삭제는 템플릿 관리(/admin/templates) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
  <aside class="ed-side" id="templatePanel" th:fragment="panel" hidden>
    <div class="ed-side-head">
      <b>템플릿</b>
      <button type="button" class="ed-x" id="templateClose" title="닫기">✕</button>
    </div>
    <div class="ed-side-tabs">
      <span class="on">내 템플릿</span>
      <span class="ed-side-count" id="templateCount"></span>
    </div>
    <div class="ed-side-body" id="templateList"><div class="ed-side-empty">불러오는 중…</div></div>
    <div class="ed-side-foot">
      <a class="ed-btn" th:href="@{/admin/templates}" target="_blank" rel="noopener" style="width:100%;justify-content:center">템플릿 관리에서 만들기 · 수정 ↗</a>
      <div class="ed-help" style="margin-top:8px">템플릿은 <b>레이아웃(화면 구성)</b>과 <b>본문 뼈대</b>를 함께 담고 있습니다. 불러오면 이 글의 레이아웃도 템플릿대로 바뀝니다. 만들기·수정은 템플릿 관리에서 합니다.</div>
    </div>
  </aside>
</body>
</html>
