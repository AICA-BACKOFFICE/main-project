<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('관리자 계정', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">관리자 계정 <span class="sub">최상위 관리자만 접근할 수 있습니다</span></h2>

  <div class="card">
    <div class="card-head">
      <div class="left"><span class="count">(총 <span th:text="${#lists.size(users)}">0</span> 건)</span></div>
      <a class="btn primary" th:href="@{/admin/users/new}">신규 등록</a>
    </div>
    <table class="list">
      <thead>
      <tr>
        <th style="width:60px">ID</th>
        <th>이메일 (로그인 ID)</th>
        <th>이름</th>
        <th style="width:130px">역할</th>
        <th style="width:90px">상태</th>
        <th style="width:150px">최근 로그인</th>
        <th style="width:130px">등록일</th>
        <th style="width:90px" class="right">액션</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="u : ${users}">
        <td class="num" th:text="${u.id}">1</td>
        <td class="mono" th:text="${u.loginId}">admin</td>
        <td>
          <b th:text="${u.name}">이름</b>
          <span class="muted" th:if="${me != null and me.id == u.id}">(나)</span>
          <span class="badge draft" th:if="${u.mustChangePw}" title="임시 비밀번호 상태">비밀번호 변경 필요</span>
        </td>
        <td><span class="badge" th:classappend="${u.role.name() == 'SUPER_ADMIN'} ? 'role-super' : (${u.role.name() == 'SUPPORT'} ? 'role-support' : 'role-admin')" th:text="${u.role.label}">역할</span></td>
        <td><span class="badge" th:classappend="${u.active} ? 'on' : 'off'" th:text="${u.active} ? '활성' : '비활성'">활성</span></td>
        <td class="muted" th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
        <td class="muted" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">-</td>
        <td class="right"><a class="btn ghost xs" th:href="@{/admin/users/{id}/edit(id=${u.id})}">수정</a></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
