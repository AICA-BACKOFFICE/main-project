spring:
  application:
    name: aica-backoffice
  profiles:
    default: local
  thymeleaf:
    cache: false
  datasource:
    # 1차 초안: 설치 없이 실행되는 H2 파일 DB. 운영 DB(PostgreSQL 16 후보) 확정 후 전환.
    url: jdbc:h2:file:./data/backoffice;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB      # 동영상 한도(ImageStorageService.MAX_VIDEO)와 맞춘다
      max-request-size: 205MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: egovframework.backoffice
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

server:
  tomcat:
    # 용량 초과 업로드도 연결을 끊지 않고 정상 오류 응답을 돌려주도록 (브라우저 "Failed to fetch" 방지)
    max-swallow-size: -1
  # 기본은 내 PC에서만 접속. 같은 네트워크의 다른 PC에 공유하려면 환경변수 BACKOFFICE_BIND=0.0.0.0 로 실행
  address: ${BACKOFFICE_BIND:127.0.0.1}
  port: ${BACKOFFICE_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

backoffice:
  site-name: AICA 관리자 페이지
  environment-label: local
  upload-dir: ./data/uploads
  # 좌측 프로필의 "AICA 홈페이지 이동" 버튼이 여는 주소 (나중에 여기만 바꾸면 됨)
  front-base-url: https://www.aica-gj.kr/main.php
  initial-admin:
    login-id: admin
    name: 최초 관리자
    # 최초 기동 시 한 번만 사용. 환경변수 BACKOFFICE_INITIAL_ADMIN_PASSWORD 로 덮어쓰기 권장.
    password: ${BACKOFFICE_INITIAL_ADMIN_PASSWORD:admin1234!}
  # 카테고리 페이지 관리: 공유용 사이트(aica-site-preview)의 페이지를 실제 화면 그대로 고치고 '사이트에 반영'
  pages:
    # 사이트 파일 폴더(about/ · stories/ · life/ · check/ · common/ 이 있는 곳). 환경변수 BACKOFFICE_SITE_ROOT 로 바꿀 수 있음
    site-root: ${BACKOFFICE_SITE_ROOT:./data/site}
    # 임시저장과 반영 전 백업(버전 기록)을 두는 폴더
    data-dir: ./data/pages
    # 프론트오피스(사이트) 주소. '반영된 페이지' 버튼이 이 주소를 엶. 비우면 이 서버의 /admin/pages/site/ 에서 보여 줌. 환경변수 BACKOFFICE_FRONT_URL
    front-url: ${BACKOFFICE_FRONT_URL:}
    # 사이드바 메뉴 순서 · 이름 · 사이트 폴더 기준 파일. parent 가 있으면 그 메뉴 아래에 펼쳐 보임(2026-10-14 이야기 페이지가 나뉨)
    items:
      - { id: about, title: 인사교 알아보기, file: about/index.html }
      - { id: stories, title: 선배들의 이야기, file: stories/index.html }
      - { id: stories-reviews, title: 선배들의 이야기 › 후기, file: stories/reviews.html, parent: stories }
      - { id: stories-interviews, title: 선배들의 이야기 › 인터뷰, file: stories/interviews.html, parent: stories }
      - { id: stories-projects, title: 선배들의 이야기 › 프로젝트, file: stories/projects.html, parent: stories }
      - { id: stories-cohorts, title: 선배들의 이야기 › 기수별 이모저모, file: stories/cohorts.html, parent: stories }
      - { id: life, title: 인사교 라이프, file: life/index.html }
      - { id: check, title: 지원 전 체크, file: check/index.html }

---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: ${BACKOFFICE_DB_URL}
    username: ${BACKOFFICE_DB_USERNAME}
    password: ${BACKOFFICE_DB_PASSWORD}
    driver-class-name: ${BACKOFFICE_DB_DRIVER:org.postgresql.Driver}
