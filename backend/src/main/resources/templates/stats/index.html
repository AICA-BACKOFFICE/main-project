<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('방문 통계', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">방문 통계
    <span class="sub" th:text="${#temporals.format(stats.from, 'yyyy-MM-dd')} + ' ~ ' + ${#temporals.format(stats.to, 'yyyy-MM-dd')}"></span>
  </h2>

  <div class="card">
    <div class="card-head">
      <div class="left">
        <div class="tabs">
          <a th:href="@{/admin/stats(days=7)}" th:classappend="${range == 7} ? 'on'">7일</a>
          <a th:href="@{/admin/stats(days=14)}" th:classappend="${range == 14} ? 'on'">14일</a>
          <a th:href="@{/admin/stats(days=30)}" th:classappend="${range == 30} ? 'on'">30일</a>
        </div>
        <!--/* 기록: 사이트 frontend/common/js/track.js → POST /api/public/track/… → 표 visit_logs · post_view_logs(V22) */-->
        <span class="count">사이트 페이지가 열릴 때 방문을, 선배들의 이야기 글을 열 때 조회를 기록해요. 관리자 화면의 미리보기는 세지 않아요.</span>
      </div>
    </div>
  </div>

  <div class="kpis" style="margin-top:16px">
    <div class="kpi"><div class="k">오늘 방문자</div><div class="v" th:text="${#numbers.formatInteger(stats.todayVisitors, 1, 'COMMA')}">0</div></div>
    <div class="kpi"><div class="k" th:text="${range} + '일 방문자'">방문자</div><div class="v" th:text="${#numbers.formatInteger(stats.periodVisitors, 1, 'COMMA')}">0</div>
      <div class="d">기간 안에서 서로 다른 방문자</div></div>
    <div class="kpi"><div class="k" th:text="${range} + '일 페이지뷰'">페이지뷰</div><div class="v" th:text="${#numbers.formatInteger(stats.periodPageViews, 1, 'COMMA')}">0</div></div>
    <div class="kpi"><div class="k" th:text="${range} + '일 게시물 조회'">조회</div><div class="v" th:text="${#numbers.formatInteger(stats.periodPostViews, 1, 'COMMA')}">0</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="left"><b>일별 추이</b></div>
      <div class="legend"><span><i style="background:#f6a59d"></i>방문자</span><span><i style="background:var(--red)"></i>게시물 조회</span></div>
    </div>
    <div class="card-body bars-wrap">
      <div class="bars" style="height:220px">
        <div class="col" th:each="d : ${stats.daily}">
          <div style="display:flex;gap:2px;align-items:flex-end;height:180px;width:100%;justify-content:center">
            <div class="bar" th:style="'height:' + ${stats.maxVisitors > 0 ? (d.visitors * 100 / stats.maxVisitors) : 0} + '%'">
              <span class="tip" th:if="${d.visitors > 0}" th:text="${d.visitors}"></span>
            </div>
            <div class="bar views" th:style="'height:' + ${stats.maxPostViews > 0 ? (d.postViews * 100 / stats.maxPostViews) : 0} + '%'">
              <span class="tip" th:if="${d.postViews > 0}" th:text="${d.postViews}"></span>
            </div>
          </div>
          <div class="lbl" th:text="${#temporals.format(d.statDay, 'M/d')}">10/20</div>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr><th>날짜</th><th class="right">방문자</th><th class="right">페이지뷰</th><th class="right">게시물 조회</th></tr></thead>
        <tbody>
        <tr th:each="d : ${stats.daily}">
          <td th:text="${#temporals.format(d.statDay, 'yyyy-MM-dd (E)')}">-</td>
          <td class="right" th:text="${d.visitors}">0</td>
          <td class="right" th:text="${d.pageViews}">0</td>
          <td class="right" th:text="${d.postViews}">0</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div class="left"><b>많이 본 글 (누적 조회 상위 10)</b></div></div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr><th style="width:60px">순위</th><th>게시물</th><th style="width:100px">종류</th><th style="width:90px">상태</th><th style="width:100px" class="right">누적 조회</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(topPosts)}"><td colspan="5" class="muted" style="text-align:center;padding:24px">아직 조회된 글이 없습니다.</td></tr>
        <tr th:each="p, it : ${topPosts}">
          <td class="num" th:text="${it.count}">1</td>
          <td><a th:href="@{/admin/posts/{kind}/{id}/preview(kind=${p.postType}, id=${p.postId})}" target="_blank" rel="noopener" data-preview
                 th:data-title="${p.title}" th:data-edit="${me.role.canManageContent() or p.authorId == me.id} ? @{/admin/posts/{kind}/{id}/edit(kind=${p.postType}, id=${p.postId})} : null"
                 th:text="${p.title}" style="font-weight:600">제목</a></td>
          <td th:text="${p.kindLabel}">후기</td>
          <td><span class="badge" th:classappend="${p.status.css}" th:text="${p.status.label}"></span></td>
          <td class="right" th:text="${#numbers.formatInteger(p.views, 1, 'COMMA')}">0</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
