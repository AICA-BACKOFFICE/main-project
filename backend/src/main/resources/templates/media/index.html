<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('미디어 관리', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">미디어 관리
    <span class="sub">올린 사진 · 동영상은 모든 관리자 · 서포터즈가 글을 쓸 때 ‘미디어에서 고르기’로 함께 써요</span>
  </h2>

  <!--/* 표 media(V25): 파일은 저장소, 표에는 이름 · 종류 · 저장소 안 위치 · 크기 · 올린 사람. 이름을 바꿔도 파일 · 주소는 그대로.
         이름 바꾸기 · 삭제는 관리자 이상은 모두, 서포터즈는 자기가 올린 것만(item.editable). 삭제하면 휴지통 › 미디어로 */-->
  <div class="card">
    <div class="card-head md-head">
      <div class="left">
        <nav class="md-types" aria-label="미디어 종류">
          <a th:href="@{/admin/media(keyword=${keyword})}" th:classappend="${type == null} ? 'on'">전체</a>
          <a th:href="@{/admin/media(type='IMAGE', keyword=${keyword})}" th:classappend="${type == 'IMAGE'} ? 'on'">이미지</a>
          <a th:href="@{/admin/media(type='VIDEO', keyword=${keyword})}" th:classappend="${type == 'VIDEO'} ? 'on'">동영상</a>
        </nav>
        <form class="md-search" th:action="@{/admin/media}" method="get">
          <input type="hidden" name="type" th:if="${type != null}" th:value="${type}">
          <input class="input" type="search" name="keyword" th:value="${keyword}" placeholder="이름 검색" style="width:180px">
          <button class="btn ghost sm" type="submit">검색</button>
          <a class="btn ghost sm" th:if="${keyword != null and !keyword.isBlank()}" th:href="@{/admin/media(type=${type})}">초기화</a>
        </form>
        <span class="count">총 <b th:text="${result.total}">0</b>개</span>
      </div>
      <div class="md-upload" id="mdUpload" th:data-api="@{/admin/media/api/upload}" th:data-max="${maxFiles}">
        <span class="md-progress" id="mdProgress" aria-live="polite"></span>
        <label class="btn primary">+ 사진 · 동영상 올리기
          <input type="file" id="mdFiles" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" multiple hidden>
        </label>
      </div>
    </div>
    <p class="md-help">이미지(JPG · PNG · GIF · WEBP, 10MB까지)와 동영상(MP4 · WEBM, 200MB까지)을 올릴 수 있어요. 한 번에 <b th:text="${maxFiles}">20</b>개까지 골라 올릴 수 있어요.</p>

    <div class="md-grid" th:unless="${result.empty}">
      <div class="md-card" th:each="m : ${result.items}" th:id="'media-' + ${m.id}">
        <a class="md-thumb" th:href="${m.url}" target="_blank" rel="noopener" th:title="${m.name} + ' 새 탭으로 보기'">
          <img th:if="${m.image}" th:src="${m.url}" alt="" loading="lazy">
          <video th:if="${m.video}" th:src="${m.url} + '#t=0.5'" preload="metadata" muted playsinline></video>
          <span class="md-type" th:classappend="${m.video} ? 'video'" th:text="${m.typeLabel}">이미지</span>
          <span class="new-mark md-new" th:if="${@nav.isNew(m.createdAt)}" title="최근 24시간 안에 새로 올린 미디어">NEW</span>
        </a>
        <div class="md-body">
          <div class="md-name" th:text="${m.name}" th:title="${m.name}">이름</div>
          <!--/* 이름 바꾸기: '이름 바꾸기'를 누르면 입력 칸이 열려요(media.js) */-->
          <form class="md-rename" th:if="${m.editable}" th:action="@{/admin/media/{id}/rename(id=${m.id})}" method="post" hidden>
            <input type="hidden" name="type" th:value="${type}">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="page" th:value="${result.page}">
            <input class="input" name="name" th:value="${m.name}" maxlength="200" required aria-label="새 이름">
            <div class="md-rename-acts">
              <button class="btn primary xs" type="submit">저장</button>
              <button class="btn xs" type="button" data-md="cancel">취소</button>
            </div>
          </form>
          <div class="md-meta">
            <span th:text="${m.sizeLabel}">1.2 MB</span> ·
            <span th:text="${m.uploaderName ?: '-'}">올린 사람</span> ·
            <span th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}">2026-10-20</span>
          </div>
          <div class="md-usage" th:if="${m.usage > 0}" th:text="'글 ' + ${m.usage} + '개에서 쓰는 중'">글 2개에서 쓰는 중</div>
          <div class="md-acts" th:if="${m.editable}">
            <button class="btn xs" type="button" data-md="rename">이름 바꾸기</button>
            <form th:action="@{/admin/media/{id}/delete(id=${m.id})}" method="post"
                  th:data-confirm="'‘' + ${m.name} + '’을(를) 삭제하시겠습니까?' + (${m.usage > 0} ? ' 지금 글 ' + ${m.usage} + '개에서 쓰고 있어요.' : '') + ' 휴지통으로 가고, 휴지통에서 복원할 수 있어요.'">
              <input type="hidden" name="type" th:value="${type}">
              <input type="hidden" name="keyword" th:value="${keyword}">
              <input type="hidden" name="page" th:value="${result.page}">
              <button class="btn danger xs" type="submit">삭제</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="empty-state" th:if="${result.empty}">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      <div th:text="${keyword != null and !keyword.isBlank()} ? '찾는 이름의 미디어가 없어요.' : '아직 올린 미디어가 없어요. ‘+ 사진 · 동영상 올리기’로 올려 보세요.'">아직 올린 미디어가 없어요.</div>
    </div>

    <nav class="pager" th:if="${result.totalPages > 1}">
      <a th:if="${result.hasPrev}" th:href="@{/admin/media(type=${type}, keyword=${keyword}, page=${result.page - 1})}">‹</a>
      <span class="dis" th:unless="${result.hasPrev}">‹</span>
      <th:block th:each="n : ${result.pageNumbers}">
        <span class="cur" th:if="${n == result.page}" th:text="${n}">1</span>
        <a th:unless="${n == result.page}" th:text="${n}" th:href="@{/admin/media(type=${type}, keyword=${keyword}, page=${n})}">2</a>
      </th:block>
      <a th:if="${result.hasNext}" th:href="@{/admin/media(type=${type}, keyword=${keyword}, page=${result.page + 1})}">›</a>
      <span class="dis" th:unless="${result.hasNext}">›</span>
    </nav>
  </div>
</main>
<th:block th:fragment="scripts"><script th:src="@{/js/media/media.js(v='20261020')}"></script></th:block>
</body>
</html>
