<!-- 글쓰기 화면 — 우측 "콘텐츠 속성" 패널 (post/editor.html 의 form 안에서 th:replace 로 포함) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="ed-props" th:fragment="props">
      <h3>콘텐츠 속성</h3>
      <p class="ed-props-desc">공개 상태와 분류, 대표 이미지를 설정합니다.</p>

      <label class="ed-props-label" for="statusSelect">공개 상태</label>
      <select class="ed-select" id="statusSelect" th:disabled="${!me.role.canManageContent()}">
        <option value="DRAFT">임시저장 · 공개되지 않음</option>
        <option value="PUBLISHED">공개 · 프론트에 게시</option>
        <option value="HIDDEN">미게시 · 저장만, 프론트 미노출</option>
      </select>

      <p class="ed-help" th:if="${!me.role.canManageContent()}">게시 상태 변경은 관리자에게 요청해 주세요.</p>
      <label class="ed-props-label" for="categoryId">카테고리 <span class="ed-help">고르면 그 종류의 글 양식으로 바뀌어요</span></label>
      <select class="ed-select" th:field="*{categoryId}" id="categoryId"
              th:with="listed=${form.categoryId != null and #lists.contains(categoryTree.![id], form.categoryId)}">
        <!--/* 미분류는 없앴어요. 지금 목록에 없는 카테고리(없음 · 숨긴 카테고리)로 저장된 예전 글만 그 상태를 그대로 보여 줘요.
               그대로 두면 본문이 지켜지고, 다른 카테고리를 고르면 그 양식으로 바뀌어요(첫 칸인 후기로 몰래 바뀌지 않게) */-->
        <option th:if="${form.id != null and !listed}" th:value="${form.categoryId != null} ? ${form.categoryId} : ''"
                th:text="${form.categoryId == null} ? '카테고리 없음 (예전 글)' : '숨긴 카테고리 (예전 글)'">카테고리 없음 (예전 글)</option>
        <option th:each="c : ${categoryTree}" th:value="${c.id}" th:text="${c.name}" th:attr="data-slug=${c.slug}"></option>
      </select>
      <p class="ed-help sf-only" style="margin-top:8px">후기는 양식에서 고른 분야, 인터뷰는 기수로 나눠 저장돼요. 이 둘은 임시저장할 때도 꼭 넣어 주세요.</p>
      <div class="ed-generic">
      <label class="ed-props-label" for="subCategoryId">세부 카테고리 <span class="ed-help">후기 → 생활·수업·프로젝트·취업 성공·진로 고민</span></label>
      <select class="ed-select" th:field="*{subCategoryId}" id="subCategoryId">
        <option value="">세부 카테고리</option>
        <th:block th:each="c : ${categoryTree}">
          <option th:each="s : ${c.children}" th:value="${s.id}" th:text="${s.name}" th:attr="data-parent=${c.id}"></option>
        </th:block>
      </select>

      <label class="ed-props-label">대표 이미지</label>
      <div class="ed-check-row">
        <label><input type="radio" th:field="*{thumbnailMode}" value="AUTO"> 본문 첫 이미지</label>
        <label><input type="radio" th:field="*{thumbnailMode}" value="MANUAL"> 직접 지정</label>
      </div>
      <div id="thumbManual" class="ed-thumb">
        <div id="thumbPreview">
          <img th:if="${form.thumbnailUrl != null and form.thumbnailUrl != ''}" th:src="${form.thumbnailUrl}" alt="">
        </div>
        <div class="row">
          <label class="ed-btn sm" style="cursor:pointer">이미지 업로드 <input type="file" id="thumbFile" accept="image/*" hidden></label>
          <button class="ed-btn sm" type="button" id="thumbClear">지우기</button>
          <span class="ed-help">권장 1200×630</span>
        </div>
      </div>

      <label class="ed-props-label" for="summary">요약</label>
      <textarea class="ed-ta" th:field="*{summary}" id="summary" rows="4" maxlength="500" placeholder="비우면 본문 앞부분으로 자동 생성됩니다"></textarea>
      </div>

      <hr class="ed-props-hr">
      <p class="ed-props-note">입력 내용은 브라우저에 자동 백업됩니다. <b>임시저장</b>·<b>저장</b>을 누르면 서버(DB)에 저장됩니다.</p>
      <div class="ed-props-actions" th:if="${form.id != null and me.role.canManageContent()}">
        <button class="ed-tool danger" type="submit" form="deleteForm">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg> 휴지통으로 이동
        </button>
      </div>
    </aside>
</body>
</html>
